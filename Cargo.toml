[workspace]
members = ["attack", "ctf"]
resolver = "2"

[workspace.package]
edition = "2021"
exclude = [".github/", "**/tests/", "**/contracts/", "**/cache/", "**/out/"]

[workspace.dependencies]
alloy = { version = "1", features = ["full", "node-bindings", "signer-local"] }
async-trait = "0.1.81"
eyre = "0.6"
rand = "0.8.5"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.120"
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "time"] }
